<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TT du Cailly – Statistiques 2026-2027</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%93%3C/text%3E%3C/svg%3E">
<style>
:root{
  --suite:#0b2f57; --brand:#0f6cbd; --brand-d:#0c548f; --brand-l:#deebf7; --hdr:#d9e2f3;
  --yellow:#ffe94d; --gold:#c9a227; --gold-l:#e9cf6a; --gold-d:#8a6d12; --ball:#f7630c;
  --ok:#107c10; --okbg:#dff6dd; --ko:#c4262e; --kobg:#fde7e9; --nul:#b06000; --nulbg:#fff4ce;
  --perf:#00a7e6; --contre:#37474f;
  --bg:#f3f2f1; --card:#fff; --ink:#201f1e; --mute:#605e5c; --line:#e1dfdd;
  --sh:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.11);
  --sh2:0 6.4px 14.4px rgba(0,0,0,.18),0 1.2px 3.6px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Segoe UI Web (West European)",-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}

/* barre de suite */
#suite{background:var(--suite);color:#fff;height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:50}
#suite .waffle{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;opacity:.9}
#suite .waffle i{display:grid;grid-template-columns:repeat(3,4px);gap:2.5px} #suite .waffle b{width:4px;height:4px;background:#fff;border-radius:1px}
#suite .app{font-weight:600;font-size:16px;white-space:nowrap}
#suite .sp{flex:1}
.search{position:relative;flex:0 1 420px;width:100%}
.search input{width:100%;height:32px;border:0;border-radius:4px;padding:0 12px 0 34px;background:rgba(255,255,255,.18);color:#fff;font:inherit}
.search input::placeholder{color:rgba(255,255,255,.8)}
.search input:focus{background:#fff;color:var(--ink);outline:2px solid #fff}
.search input:focus::placeholder{color:var(--mute)}
.search svg{position:absolute;left:10px;top:8px;width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;pointer-events:none}
.search input:focus~svg{stroke:var(--mute)}
#sres{position:absolute;top:36px;left:0;right:0;background:#fff;color:var(--ink);border-radius:4px;box-shadow:var(--sh2);overflow:hidden;display:none}
#sres a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;color:var(--ink)} #sres a:hover{background:var(--brand-l);text-decoration:none}
#sres small{color:var(--mute)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ball);display:grid;place-items:center;font-weight:600;font-size:12px}

/* en-tête de site */
#site{background:#fff;border-bottom:1px solid var(--line)}
.site-in{max-width:1320px;margin:0 auto;padding:14px 24px 0}
.brandrow{display:flex;align-items:center;gap:14px}
.logo{height:64px;width:auto;flex:none;display:block}
.brandrow h1{margin:0;font-size:22px;font-weight:600;line-height:1.15}
.brandrow p{margin:0;color:var(--mute);font-size:13px}
#nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
#nav a{padding:10px 14px;color:var(--ink);white-space:nowrap;border-bottom:3px solid transparent;font-weight:400}
#nav a:hover{background:var(--bg);text-decoration:none}
#nav a.on{border-color:var(--brand);font-weight:600;color:var(--brand-d)}
#nav .div{width:1px;background:var(--line);margin:8px 6px}

/* barre de commandes */
#cmd{background:#fff;border-bottom:1px solid var(--line)}
.cmd-in{max-width:1320px;margin:0 auto;padding:4px 24px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:44px}
.cbtn{display:inline-flex;gap:7px;align-items:center;border:0;background:transparent;padding:6px 10px;border-radius:4px;color:var(--ink)}
.cbtn:hover{background:var(--bg)} .cbtn svg{width:16px;height:16px;stroke:var(--brand);fill:none;stroke-width:2}
.cmd-in .grow{flex:1}
.src{color:var(--mute);font-size:12px}

main{max-width:1320px;margin:0 auto;padding:20px 24px 40px}
.crumbs{font-size:13px;color:var(--mute);margin-bottom:12px}
.crumbs a{color:var(--mute)}

/* hero */
.hero{border-radius:8px;overflow:hidden;color:#fff;position:relative;padding:34px 36px;margin-bottom:22px;box-shadow:var(--sh);border:1px solid #3a3a3a;
  background:radial-gradient(circle at 90% 22%,var(--gold-l) 0 5px,transparent 6px),radial-gradient(circle at 86% 30%,#f5f5f5 0 40px,rgba(255,255,255,.0) 41px),radial-gradient(circle at 80% 125%,rgba(201,162,39,.28) 0 240px,transparent 241px),linear-gradient(120deg,#050505,#1b1b1b 70%,#262014)}
.hero small{letter-spacing:.16em;text-transform:uppercase;color:var(--gold-l);font-size:12px;font-weight:600}
.hero h2{margin:6px 0 6px;font-size:34px;font-weight:700;line-height:1.1;background:linear-gradient(180deg,#f3dc84,#c9a227 55%,#9b7a14);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:620px;color:#e7e2d3;font-size:15px}
.hero .stripe{position:absolute;left:0;bottom:0;height:5px;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l) 35%,transparent 35%)}

h3.sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:16px;font-weight:600;padding:8px 12px;background:var(--brand-l);border-left:5px solid var(--brand);border-radius:0 4px 4px 0}
h3.sec small{font-weight:400;color:var(--mute);font-size:12px}
h3.sec .r{margin-left:auto;font-weight:400;font-size:13px}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-teams{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g-rounds{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border-radius:6px;box-shadow:var(--sh);padding:16px}
.kpi .lab{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-size:30px;font-weight:600;line-height:1.15;margin-top:2px}
.kpi .sub{color:var(--mute);font-size:12px;margin-top:2px}
.kpi.hl{border-top:4px solid var(--yellow)}

/* cartes équipes */
.tcard{padding:0;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.tcard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.tcard .top{padding:14px 16px;background:linear-gradient(120deg,var(--suite),var(--brand));color:#fff;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tcard .top h4{margin:0;font-size:18px;font-weight:600}
.tcard .top small{opacity:.85}
.divtag{background:var(--yellow);color:#201f1e;font-weight:700;border-radius:3px;padding:2px 8px;font-size:12px}
.tcard .body{padding:14px 16px;flex:1}
.tcard .row{display:flex;gap:18px;margin-bottom:10px}
.tcard .row div{flex:1}
.tcard .row b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.tcard .row span{color:var(--mute);font-size:12px}
.form{display:flex;gap:4px;align-items:center;margin:6px 0 10px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.dot.V{background:var(--ok)} .dot.N{background:#e5a100} .dot.D{background:var(--ko)}
.next{background:var(--bg);border-radius:4px;padding:8px 10px;font-size:13px}
.next b{display:block}
.tcard .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:4px;padding:7px 14px;font-weight:600;border:1px solid var(--brand);background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-d);text-decoration:none}
.btn.sec{background:#fff;color:var(--brand)} .btn.sec:hover{background:var(--brand-l)}
.btn.sm{padding:4px 10px;font-size:12px}

/* onglets */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:6px;align-items:flex-end;flex-wrap:wrap}
.tabs a{padding:10px 16px;color:var(--ink);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{background:#fff;text-decoration:none}
.tabs a.on{border-color:var(--brand);color:var(--brand-d);font-weight:600;background:#fff}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;margin-bottom:6px}
.seg button{border:0;background:#fff;padding:6px 14px}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.seg button:disabled{color:#a19f9d;cursor:not-allowed}

.pagehead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.pagehead h2{margin:0;font-size:28px;font-weight:600}

/* tableaux */
.tw{overflow-x:auto;background:#fff;border-radius:6px;box-shadow:var(--sh)}
table.d{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.d th{background:var(--hdr);font-weight:600;text-align:center;padding:8px 10px;border-bottom:1px solid #b4c6e7;white-space:nowrap}
table.d th.y{background:var(--yellow)}
table.d th.l,table.d td.l{text-align:left}
table.d td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line)}
table.d tr:last-child td{border-bottom:0}
table.d tbody tr:hover td{background:#f8fbff}
table.d tr.me td{background:var(--brand-l);font-weight:600}
table.d td.nm{font-weight:600;text-align:left}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--ko);font-weight:600}.zero{color:var(--mute)}
.bar{position:relative;min-width:110px;height:20px;background:#f3f2f1;border-radius:10px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#fff176,var(--yellow))}
.bar span{position:relative;display:block;text-align:center;font-weight:600;font-size:12px;line-height:20px}
.rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:700;font-size:12px;background:var(--bg)}
.rk.r1{background:#ffd700}.rk.r2{background:#d0d4d9}.rk.r3{background:#e0a97a}
td.pill-v{color:var(--ok);font-weight:600}.td-l{color:var(--ko);font-weight:600}
.tag{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.ko{background:var(--kobg);color:var(--ko)}.tag.nul{background:var(--nulbg);color:var(--nul)}.tag.mu{background:#edebe9;color:var(--mute)}

/* planning */
.plan th.dt{min-width:96px;font-size:12px}
.plan th.dt small{display:block;font-weight:400;color:#323130}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:700}
.mk.ok{background:var(--okbg);color:var(--ok)}.mk.ko{background:var(--kobg);color:var(--ko)}.mk.no{color:#c8c6c4}
.plan tfoot td{background:#faf9f8;font-weight:600;font-size:12px;border-top:2px solid var(--line)}
.legend{display:flex;gap:16px;color:var(--mute);font-size:12px;margin:8px 2px;flex-wrap:wrap}

/* graphiques */
.chart svg{width:100%;height:auto;display:block}
.chart .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.chart .lg i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart h5{margin:0 0 8px;font-size:14px}

/* journées */
.rd{padding:0;overflow:hidden}
.rd .h{display:flex;justify-content:space-between;align-items:center;background:var(--hdr);padding:8px 12px;font-weight:600}
.rd .h small{font-weight:400;color:#323130}
.rd .m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px}
.rd .m:last-of-type{border-bottom:0}
.rd .m .t2{text-align:right}
.rd .m.me{background:var(--brand-l)} .rd .m.me .t1,.rd .m.me .t2{}
.rd .m .w{font-weight:700}
.sc{display:inline-flex;gap:3px;align-items:center;font-weight:700;min-width:62px;justify-content:center}
.sc b{display:inline-block;min-width:24px;padding:1px 4px;border-radius:3px;background:#edebe9;text-align:center}
.sc b.w{background:var(--okbg);color:var(--ok)} .sc b.n{background:var(--nulbg);color:var(--nul)} .sc b.e{background:#faf9f8;color:#a19f9d}
.rd .f{padding:8px 12px;background:#faf9f8;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.rd.fut{opacity:.8}
.warn{background:var(--nulbg);border-left:4px solid #e5a100;border-radius:0 4px 4px 0;padding:8px 12px;margin:10px 0;font-size:13px}

/* détail des matchs */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;color:var(--ink)}
.chip:hover{background:var(--bg);text-decoration:none}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.banner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;background:#fff;border-radius:6px;box-shadow:var(--sh);padding:18px 22px;border-top:5px solid var(--yellow)}
.banner .tm{font-size:18px;font-weight:600} .banner .tm.r{text-align:right}
.banner .tm small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.banner .big{font-size:38px;font-weight:700;display:flex;gap:10px;align-items:center}
.banner .big span.d{color:var(--mute);font-weight:400}
.banner .res{text-align:center;margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(410px,1fr));gap:12px;margin-top:14px}
.mc{background:#fff;border-radius:6px;box-shadow:var(--sh);overflow:hidden}
.mc .mh{background:var(--brand-l);padding:5px 12px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;color:#323130}
.pr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .n{font-weight:400} .pr .n small{color:var(--mute);margin-left:6px}
.pr.win{background:#f3fbf2} .pr.win .n{font-weight:700}
.pr .cb{font-size:10px;background:var(--brand);color:#fff;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.sets{display:flex;gap:3px}
.sets b{min-width:26px;text-align:center;padding:2px 3px;border-radius:3px;background:#edebe9;font-weight:600;font-size:13px}
.sets b.w{background:var(--okbg);color:var(--ok)} .sets b.e{background:transparent;color:#c8c6c4;font-weight:400}
.pr .tot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#edebe9}
.pr.win .tot{background:var(--ok);color:#fff}

/* raquette */
.gear{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.gear .card b{display:block;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.gear .card span{font-size:17px;font-weight:600}
.arrow{color:var(--ball);font-weight:700}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.imgs figure{margin:0;background:#fff;box-shadow:var(--sh);border-radius:6px;padding:12px}
.imgs img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px}
.imgs figcaption{font-weight:600;margin-bottom:8px}

footer{max-width:1320px;margin:0 auto;padding:0 24px 30px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323130;color:#fff;padding:10px 18px;border-radius:4px;box-shadow:var(--sh2);display:none;z-index:99}
.empty{color:var(--mute);padding:24px;text-align:center;background:#fff;border-radius:6px;box-shadow:var(--sh)}
@media(max-width:700px){main,.site-in,.cmd-in{padding-left:12px;padding-right:12px}.hero{padding:24px 20px}.hero h2{font-size:26px}.banner{grid-template-columns:1fr}.banner .tm.r{text-align:left}.mgrid{grid-template-columns:1fr}#suite .app{display:none}}
@media print{#suite,#cmd,#nav,.tabs,.seg,footer .noprint{display:none!important}body{background:#fff}.card,.tw{box-shadow:none;border:1px solid var(--line)}}

.cbtn.gold{color:var(--gold-d);font-weight:600}.cbtn.gold svg{stroke:var(--gold-d)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:16px}
.mdl{background:#fff;border-radius:8px;box-shadow:var(--sh2);width:100%;max-width:400px;padding:22px;border-top:5px solid var(--gold)}
.mdl h3{margin:0 0 4px;font-size:19px}.mdl p{margin:0 0 14px;color:var(--mute);font-size:13px}
.mdl label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
.mdl input{width:100%;height:34px;border:1px solid #8a8886;border-radius:4px;padding:0 10px;font:inherit}
.mdl input:focus{outline:2px solid var(--brand);border-color:transparent}
.mdl .err{color:var(--ko);font-size:13px;min-height:18px;margin-top:8px}
.mdl .act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mdl .btn{cursor:pointer}

</style>
</head>
<body>
<div id="suite">
  <div class="waffle"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></div>
  <span class="app">TT du Cailly · Statistiques</span>
  <div class="sp"></div>
  <div class="avatar" title="TT du Cailly">TT</div>

/* ============================================================
   1) LECTEUR XLSX (zip + XML) – 100 % local, aucune dépendance
   ============================================================ */
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const key  = s => norm(s).toUpperCase();
const isNum = v => typeof v === 'number' && isFinite(v);
const num = v => (isNum(v) ? v : null);
const caillyNum = s => { const m = key(s).match(/TT DU CAILLY\s*(\d+)/); return m ? +m[1] : null; };
const colNum = L => L.split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0);
const xmlDecode = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

async function inflateRaw(u8) {
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let i = u8.length - 22;
  while (i >= 0 && dv.getUint32(i, true) !== 0x06054b50) i--;
  if (i < 0) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx) valide.");
  const total = dv.getUint16(i + 10, true);
  let p = dv.getUint32(i + 16, true);
  const files = {}, td = new TextDecoder();
  for (let n = 0; n < total; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    files[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { method, csize, lho };
    p += 46 + nl + el + cl;
  }
  return {
    has: n => !!files[n],
    async bytes(name) {
      const f = files[name]; if (!f) return null;
      const nl = dv.getUint16(f.lho + 26, true), el = dv.getUint16(f.lho + 28, true);
      const start = f.lho + 30 + nl + el, data = u8.subarray(start, start + f.csize);
      return f.method === 0 ? data : await inflateRaw(data);
    },
    async text(name) { const b = await this.bytes(name); return b ? td.decode(b) : null; }
  };
}

function parseXml(txt) { return new DOMParser().parseFromString(txt, 'application/xml'); }

function parseSharedStrings(txt) {
  if (!txt) return [];
  const doc = parseXml(txt), out = [];
  for (const si of doc.getElementsByTagName('si')) {
    let s = '';
    for (const t of si.getElementsByTagName('t')) {
      if (t.parentNode.nodeName === 'rPh') continue;   // ignorer les furigana
      s += t.textContent;
    }
    out.push(s);
  }
  return out;
}

function parseSheet(name, txt, sst) {
  const doc = parseXml(txt), cells = new Map();
  let maxR = 0;
  for (const c of doc.getElementsByTagName('c')) {
    const ref = c.getAttribute('r'), m = ref.match(/^([A-Z]+)(\d+)$/);
    if (!m) continue;
    const t = c.getAttribute('t');
    const vEl = c.getElementsByTagName('v')[0];
    let val = null;
    if (t === 'inlineStr') {
      val = Array.from(c.getElementsByTagName('t')).map(x => x.textContent).join('');
    } else if (vEl) {
      const raw = vEl.textContent;
      if (t === 's') val = sst[+raw] ?? '';
      else if (t === 'str') val = raw;
      else if (t === 'b') val = raw === '1';
      else if (t === 'e') val = null;                 // #DIV/0! etc.
      else val = raw === '' ? null : Number(raw);
    }
    if (val === null || val === '') continue;
    const r = +m[2], col = colNum(m[1]);
    cells.set(r * 100 + col, val);
    if (r > maxR) maxR = r;
  }
  return { name, maxR, g: (r, c) => cells.get(r * 100 + c) ?? null };
}

async function readWorkbook(buf) {
  const zip = await unzip(buf);
  const wbXml = await zip.text('xl/workbook.xml');
  if (!wbXml) throw new Error('Classeur Excel illisible (workbook.xml manquant).');
  const rels = await zip.text('xl/_rels/workbook.xml.rels');
  const relMap = {};
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)) {
    const id = (m[0].match(/\bId="([^"]+)"/) || [])[1], tg = (m[0].match(/\bTarget="([^"]+)"/) || [])[1];
    if (id && tg) relMap[id] = tg.startsWith('/') ? tg.slice(1) : 'xl/' + tg;
  }
  const sst = parseSharedStrings(await zip.text('xl/sharedStrings.xml'));
  const sheets = [];
  for (const m of wbXml.matchAll(/<sheet\b[^>]*>/g)) {
    const nm = xmlDecode((m[0].match(/\bname="([^"]*)"/) || [])[1] || '');
    const rid = (m[0].match(/\br:id="([^"]+)"/) || [])[1];
    const path = relMap[rid];
    const txt = path && await zip.text(path);
    if (!txt) continue;
    const sh = parseSheet(nm, txt, sst); sh.path = path; sheets.push(sh);
  }
  return { zip, sheets };
}

/* images d'un onglet (ex. « Ma Raquette ») */
async function sheetImages(zip, sheetPath) {
  const dir = sheetPath.replace(/[^/]+$/, ''), file = sheetPath.split('/').pop();
  const relTxt = await zip.text(`${dir}_rels/${file}.rels`);
  if (!relTxt) return [];
  const dr = relTxt.match(/Target="([^"]*drawings\/[^"]+)"/);
  if (!dr) return [];
  const drawPath = 'xl/' + dr[1].replace(/^\.\.\//, '');
  const drawTxt = await zip.text(drawPath);
  const drelTxt = await zip.text(drawPath.replace(/([^/]+)$/, '_rels/$1.rels'));
  if (!drawTxt || !drelTxt) return [];
  const rmap = {};
  for (const m of drelTxt.matchAll(/<Relationship\b[^>]*>/g)) {
    const id = (m[0].match(/\bId="([^"]+)"/) || [])[1], tg = (m[0].match(/\bTarget="([^"]+)"/) || [])[1];
    if (id && tg) rmap[id] = 'xl/' + tg.replace(/^\.\.\//, '');
  }
  const out = [];
  for (const a of drawTxt.split(/<xdr:(?:twoCellAnchor|oneCellAnchor)/).slice(1)) {
    const col = +((a.match(/<xdr:from><xdr:col>(\d+)</) || [])[1] ?? 0);
    const rid = (a.match(/r:embed="([^"]+)"/) || [])[1];
    const mp = rmap[rid]; if (!mp) continue;
    const bytes = await zip.bytes(mp); if (!bytes) continue;
    const ext = mp.split('.').pop().toLowerCase();
    const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : ext === 'gif' ? 'image/gif' : 'image/png';
    out.push({ col, url: URL.createObjectURL(new Blob([bytes], { type: mime })) });
  }
  return out.sort((x, y) => x.col - y.col);
}

/* ============================================================
   2) ANALYSE DES ONGLETS → MODÈLE DE DONNÉES
   ============================================================ */
function serialToDate(n) { return new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000); }

/* --- onglet « D2 Equipe 1 Phase1 » … : stats, planning, résultats, classement --- */
function parseTeamSheet(S) {
  const out = { players: [], planning: null, rounds: [], standing: null, club: null, division: null, poule: null };

  // Statistiques individuelles
  let hr = 0;
  for (let r = 1; r <= 15; r++) if (norm(S.g(r, 1)).toLowerCase() === 'joueurs') { hr = r; break; }
  if (hr) {
    const cm = {}, map = { 'phase 1': 'p1', '+/- après phase 1': 'diff', 'phase 2': 'p2', 'mj': 'mj', 'v': 'v', 'd': 'd', 'perfs': 'perfs', 'contres': 'contres', '% victoires': 'pct' };
    for (let c = 2; c <= 12; c++) { const h = norm(S.g(hr, c)).toLowerCase(); if (map[h] && !cm[map[h]]) cm[map[h]] = c; }
    for (let r = hr + 1; r <= hr + 40; r++) {
      const name = norm(S.g(r, 1)); if (!name) break;
      const p = { name, short: norm(S.g(r, 12)) || name.split(' ').pop() };
      for (const k of Object.keys(cm)) p[k] = num(S.g(r, cm[k]));
      for (const k of ['mj', 'v', 'd', 'perfs', 'contres']) if (p[k] === null) p[k] = 0;
      p.pct = p.mj > 0 ? p.v / p.mj * 100 : null;
      p.diff = isNum(p.p2) && isNum(p.p1) ? p.p2 - p.p1 : null;
      out.players.push(p);
    }
  }

  // Planning de présences
  let pr = 0;
  for (let r = 1; r <= S.maxR; r++) if (/^planning pr/i.test(norm(S.g(r, 1)))) { pr = r; break; }
  if (pr) {
    const pl = { title: norm(S.g(pr, 1)), dates: [], opponents: [], rows: [] };
    let nc = 0;
    for (let c = 2; c <= 20; c++) { if (S.g(pr + 1, c) !== null || S.g(pr + 2, c) !== null) nc = c - 1; }
    for (let c = 2; c <= nc + 1; c++) {
      const d = S.g(pr + 1, c);
      pl.dates.push(isNum(d) ? serialToDate(d) : (d ? norm(d) : null));
      pl.opponents.push(norm(S.g(pr + 2, c)));
    }
    for (let r = pr + 3; r <= pr + 40; r++) {
      const name = norm(S.g(r, 1));
      if (!name || /equipe\s*\d/i.test(name)) break;
      pl.rows.push({ name, cells: pl.dates.map((_, i) => { const v = norm(S.g(r, i + 2)); return v === '√' || v === '✓' ? 'ok' : v.toUpperCase() === 'X' ? 'ko' : ''; }) });
    }
    out.planning = pl;
  }

  // Étiquette « TT du Cailly 1 / Equipe 1 / D2 »
  for (let r = 1; r <= S.maxR && r < 140; r++) {
    const m = norm(S.g(r, 1)).match(/^(TT du Cailly\s*\d+)\s*\/\s*Equipe\s*\d+\s*\/\s*(D\d)/i);
    if (m) { out.club = norm(m[1]); out.division = m[2].toUpperCase(); break; }
  }

  // Résultats par journée (deux blocs de colonnes : A-D puis E-H)
  let rr = 0, cr = 0;
  for (let r = 1; r <= S.maxR; r++) {
    const a = norm(S.g(r, 1));
    if (!rr && /^r[ée]sultats/i.test(a)) { rr = r; out.resultsTitle = a; }
    if (!cr && /^classement\s+j/i.test(a)) cr = r;
  }
  if (rr) {
    const end = cr || S.maxR + 1, byN = {};
    for (let r = rr + 1; r < end; r++) {
      for (const c0 of [1, 5]) {
        const m = norm(S.g(r, c0)).match(/^J(\d+)\s*-\s*(.+)$/i);
        if (!m) continue;
        const rd = { n: +m[1], dateLabel: norm(m[2]), matches: [] };
        for (let k = r + 1; k < end && k <= r + 8; k++) {
          const home = norm(S.g(k, c0));
          if (!home || /^J\d+\s*-/i.test(home)) break;
          rd.matches.push({ home, away: norm(S.g(k, c0 + 3)), hs: num(S.g(k, c0 + 1)), as: num(S.g(k, c0 + 2)) });
        }
        byN[rd.n] = rd;
      }
    }
    out.rounds = Object.values(byN).sort((a, b) => a.n - b.n);
    if (out.planning) out.rounds.forEach(rd => { const d = out.planning.dates[rd.n - 1]; if (d instanceof Date) rd.date = d; });
  }

  // Classement
  if (cr) {
    const st = { title: norm(S.g(cr, 1)), rows: [] };
    for (let r = cr + 3; r <= cr + 20; r++) {
      const team = norm(S.g(r, 1)); if (!team) break;
      const gp = num(S.g(r, 7)), pp = num(S.g(r, 8));
      st.rows.push({ team, mj: num(S.g(r, 2)) ?? 0, pts: num(S.g(r, 3)) ?? 0, g: num(S.g(r, 4)) ?? 0, n: num(S.g(r, 5)) ?? 0, p: num(S.g(r, 6)) ?? 0,
        gp: gp ?? 0, pp: pp ?? 0, diff: num(S.g(r, 9)) ?? ((gp ?? 0) - (pp ?? 0)) });
    }
    out.standing = st;
  }
  const pm = (out.standing?.title + ' ' + (out.resultsTitle || '') + ' ' + (out.planning?.title || '')).match(/Poule\s*(\d+)/i);
  out.poule = pm ? +pm[1] : null;
  return out;
}

/* --- onglet « Détail match Journée Equipe n » --- */
function parseMatchSheet(S) {
  const journees = []; let cur = null;
  const setsOf = (r, c0) => { const a = []; for (let c = c0; c < c0 + 5; c++) a.push(num(S.g(r, c))); return a; };
  const finish = (m) => {
    const n1 = m.s1.filter(isNum).length, n2 = m.s2.filter(isNum).length;
    m.w1 = 0; m.w2 = 0;
    for (let i = 0; i < 5; i++) if (isNum(m.s1[i]) && isNum(m.s2[i])) { if (m.s1[i] > m.s2[i]) m.w1++; else if (m.s2[i] > m.s1[i]) m.w2++; }
    if (n1 + n2 > 0) m.winner = m.w1 > m.w2 ? 1 : m.w2 > m.w1 ? 2 : 0;
    else if (m.t1 || m.t2) m.winner = /gagn/i.test(m.t1) || /perdu/i.test(m.t2) ? 1 : /gagn/i.test(m.t2) || /perdu/i.test(m.t1) ? 2 : 0;
    else m.winner = 0;
    m.played = m.winner !== 0 || n1 + n2 > 0;
    return m;
  };
  for (let r = 1; r <= S.maxR; r++) {
    const a = String(S.g(r, 1) ?? '');
    const jm = a.match(/^\s*Journ[ée]e\s*(\d+)\s*(D\d)?\s*(?:Phase\s*(\d))?/i);
    if (jm) {
      const line2 = norm(a.split('\n').slice(1).join(' ')), parts = line2.split(/\s*\/\s*/);
      cur = { n: +jm[1], div: jm[2] || null, phaseLabel: jm[3] ? +jm[3] : null, home: norm(parts[0]), away: norm(parts[1]), matches: [], banner: null };
      journees.push(cur); continue;
    }
    if (!cur) continue;
    // match de gauche (simples 1 → 8)
    if (/^match\s*\d+/i.test(norm(S.g(r, 1)))) {
      let pr = r + 1; while (pr < r + 4 && norm(S.g(pr, 1)).toLowerCase() !== 'joueurs') pr++;
      cur.matches.push(finish({ no: cur.matches.filter(x => x.side === 'L').length + 1, side: 'L', kind: 'single',
        p1: { name: norm(S.g(pr + 1, 1)), rank: S.g(pr + 1, 2) }, p2: { name: norm(S.g(pr + 2, 1)), rank: S.g(pr + 2, 2) },
        s1: setsOf(pr + 1, 3), s2: setsOf(pr + 2, 3), t1: '', t2: '' }));
    }
    // match de droite (doubles 9-10 puis simples 11 → 14)
    const hv = norm(S.g(r, 8));
    if (/^match\s*\d+/i.test(hv)) {
      let pr = r + 1; while (pr < r + 4 && norm(S.g(pr, 8)).toLowerCase() !== 'joueurs') pr++;
      const dbl = /double/i.test(hv), no = +hv.match(/\d+/)[0];
      const t1 = typeof S.g(pr + 1, 10) === 'string' ? norm(S.g(pr + 1, 10)) : '', t2 = typeof S.g(pr + 2, 10) === 'string' ? norm(S.g(pr + 2, 10)) : '';
      cur.matches.push(finish({ no, side: 'R', kind: dbl ? 'double' : 'single',
        p1: { name: norm(S.g(pr + 1, 8)), rank: S.g(pr + 1, 9) }, p2: { name: norm(S.g(pr + 2, 8)), rank: S.g(pr + 2, 9) },
        s1: t1 ? [null, null, null, null, null] : setsOf(pr + 1, 10), s2: t2 ? [null, null, null, null, null] : setsOf(pr + 2, 10), t1, t2 }));
    }
    if (typeof S.g(r, 8) === 'string' && /^(victoire|d[ée]faite|match nul|nul)/i.test(String(S.g(r, 8)).trim())) {
      const raw = String(S.g(r, 8)).trim(), sc = raw.match(/(\d+)\s*-\s*(\d+)/);
      cur.banner = { text: norm(raw), a: sc ? +sc[1] : null, b: sc ? +sc[2] : null };
    }
  }
  // numérotation séquentielle fiable (singles 1-8 à gauche) + score calculé
  for (const j of journees) {
    j.matches.filter(m => m.side === 'L').forEach((m, i) => m.no = i + 1);
    j.matches.sort((x, y) => x.no - y.no);
    j.sa = j.matches.filter(m => m.winner === 1).length;
    j.sb = j.matches.filter(m => m.winner === 2).length;
    j.side = caillyNum(j.home) ? 1 : caillyNum(j.away) ? 2 : 0;
    j.played = j.matches.some(m => m.played);
  }
  // phase : se déduit de la séquence (retour à J1 = nouvelle phase)
  let ph = 1, prev = null;
  for (const j of journees) { if (prev !== null && j.n <= prev) ph++; j.phase = ph; prev = j.n; }
  return journees;
}

/* --- onglet « Points gagnés | Perdus » --- */
function parsePointsSheet(S) {
  let hr = 0;
  for (let r = 1; r <= 15; r++) for (let c = 1; c <= 4; c++) if (norm(S.g(r, c)).toLowerCase() === 'equipes') hr = hr || r;
  if (!hr) return null;
  const bc = 2; // colonne B
  const jcols = [];
  for (let c = 4; c <= 30; c++) { const h = norm(S.g(hr + 1, c)); if (/^journ[ée]e\s*\d+/i.test(h)) jcols.push({ c, n: +h.match(/\d+/)[0] }); }
  const lastJ = jcols.length ? jcols[jcols.length - 1].c : 11;
  const rows = []; let team = null;
  for (let r = hr + 2; r <= hr + 80; r++) {
    const t = norm(S.g(r, bc)), name = norm(S.g(r, 4));
    if (!name && !t) { if (r > hr + 4 && !S.g(r + 1, 4)) break; else continue; }
    if (t) team = t;
    if (!name) continue;
    const base = num(S.g(r, 3));
    const vals = jcols.map(j => num(S.g(r, j.c)));
    const total = vals.reduce((a, v) => a + (v ?? 0), 0);
    rows.push({ team: team, teamNo: +((team || '').match(/Equipe\s*(\d)/i) || [])[1] || null, div: (team || '').match(/D\d/)?.[0] || '', name, base, vals, total, live: (base ?? 0) + total });
  }
  return { journees: jcols.map(j => j.n), rows, title: norm(S.g(hr, 5)) };
}

/* --- onglet « Ma Raquette » --- */
function parseRaquette(S) {
  const out = { current: [], evolution: [], title: '', table: null };
  for (let r = 1; r <= 12; r++) {
    const f = norm(S.g(r, 6)), g = norm(S.g(r, 7));
    if (g && /^(bois|coup droit|revers)$/i.test(f)) out.current.push({ label: f, value: g });
  }
  let er = 0;
  for (let r = 1; r <= S.maxR; r++) if (/^[ée]volution/i.test(norm(S.g(r, 1)))) { er = r; out.title = norm(S.g(r, 1)); break; }
  if (er) {
    for (let r = er + 1; r <= er + 8; r++) {
      const a = norm(S.g(r, 1)), b = norm(S.g(r, 2));
      if (/^crit[èe]re/i.test(a)) break;
      if (a && b && !/^r[ée]sum/i.test(a)) out.evolution.push({ label: a, value: b });
    }
    let tr = 0;
    for (let r = er; r <= S.maxR; r++) if (/^crit[èe]re$/i.test(norm(S.g(r, 1)))) { tr = r; break; }
    if (tr) {
      const head = c => { const [a, ...b] = norm(S.g(tr, c)).split(':'); return { label: norm(a), product: norm(b.join(':')) }; };
      const rows = [];
      for (let r = tr + 1; r <= tr + 30; r++) { const a = norm(S.g(r, 1)); if (!a) break; rows.push({ c: a, cd: [norm(S.g(r, 2)), norm(S.g(r, 3))], rv: [norm(S.g(r, 5)), norm(S.g(r, 6))] }); }
      out.table = { cdHead: [head(2), head(3)], rvHead: [head(5), head(6)], rows };
    }
  }
  return out;
}

/* --- assemblage --- */
async function buildModel(buf) {
  const { zip, sheets } = await readWorkbook(buf);
  const teams = {}, model = { teams: [], points: null, raquette: null, imgs: [], sheetNames: sheets.map(s => s.name) };
  const T = n => teams[n] || (teams[n] = { id: n, phases: {}, matchSheets: [], journees: [] });
  for (const S of sheets) {
    let m;
    if ((m = S.name.match(/^D(\d)\s+Equipe\s*(\d)\s*(?:Phase\s*(\d))?/i))) {
      const t = T(+m[2]), ph = +(m[3] || 1), d = parseTeamSheet(S);
      d.phase = ph; d.sheet = S.name; t.phases[ph] = d; t.division = t.division || ('D' + m[1]);
      if (d.club) t.club = d.club;
      if (d.division) t.division = d.division;
    } else if ((m = S.name.match(/^D[ée]tail match.*Equipe\s*(\d)/i))) {
      const t = T(+m[1]), sheetPh = +((S.name.match(/Phase\s*(\d)/i) || [])[1] || 1);
      const js = parseMatchSheet(S);
      js.forEach(j => { j.phase += sheetPh - 1; j.sheet = S.name; t.journees.push(j); });
      t.matchSheets.push(S.name);
    } else if (/points gagn/i.test(S.name)) {
      model.points = parsePointsSheet(S);
    }
  }
  model.teams = Object.values(teams).sort((a, b) => a.id - b.id);
  for (const t of model.teams) {
    t.club = t.club || `TT du Cailly ${t.id}`;
    t.phaseList = Object.keys(t.phases).map(Number).sort((a, b) => a - b);
  }
  if (!model.teams.length) throw new Error("Aucun onglet « D? Equipe n Phase n » trouvé dans ce classeur.");
  return model;
}

/* ---------- calculs ---------- */
const phaseData = (t, p) => t.phases[p] || t.phases[t.phaseList[t.phaseList.length - 1]];
function snap(t, p) {
  const d = t.phases[p]; if (!d) return null;
  const me = d.standing?.rows.find(r => caillyNum(r.team) === t.id) || null;
  const rank = me ? d.standing.rows.indexOf(me) + 1 : null;
  const games = [];
  for (const rd of d.rounds) {
    const m = rd.matches.find(x => caillyNum(x.home) === t.id || caillyNum(x.away) === t.id);
    if (!m) continue;
    const home = caillyNum(m.home) === t.id, played = isNum(m.hs) && isNum(m.as);
    const f = home ? m.hs : m.as, a = home ? m.as : m.hs;
    games.push({ n: rd.n, date: rd.date, dateLabel: rd.dateLabel, home, opp: home ? m.away : m.home, f, a, played, res: !played ? null : f > a ? 'V' : f < a ? 'D' : 'N' });
  }
  const done = games.filter(g => g.played);
  const next = games.find(g => !g.played) || null;
  const roundsPlayed = d.rounds.filter(rd => rd.matches.some(m => isNum(m.hs) && isNum(m.as))).length;
  return { d, me, rank, size: d.standing?.rows.length || 0, games, done, next, form: done.slice(-5).map(g => g.res), roundsPlayed };
}
const bestPhase = () => {
  let best = 1;
  for (const t of S.model.teams) for (const p of t.phaseList) if (snap(t, p).roundsPlayed > 0) best = Math.max(best, p);
  return best;
};

  const max = Math.max(4, ...players.flatMap(p => series.map(s => p[s[0]] || 0)));

   <div class="lg">${series.map(s => `<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join('')}</div>`;

    <div class="pagehead"><h2>${esc(t.club)}</h2><span class="divtag">${esc(t.division)}</span><span style="color:var(--mute)">Équipe ${t.id}${phaseData(t, p).poule ? ' · Poule ' + phaseData(t, p).poule : ''} · Phase ${p}</span></div>

}

/* ---------- détail des matchs ---------- */
function setsHtml(a, b, win) {
  const cells = [];
  for (let i = 0; i < 5; i++) {
    if (!isNum(a[i])) { if (i < 3 || isNum(b[i])) cells.push(`<b class="e">·</b>`); continue; }
    const w = isNum(b[i]) && a[i] > b[i];
    cells.push(`<b class="${w ? 'w' : ''}">${a[i]}</b>`);
  }
  return `<div class="sets">${cells.join('')}</div>`;
}
function matchCard(m, side) {
  const rows = [1, 2].map(k => {
    const pl = m['p' + k], s = m['s' + k], o = m['s' + (3 - k)], t = m['t' + k];
    const win = m.winner === k, mine = side === k;
    const sets = t ? `<span class="tag ${/gagn/i.test(t) ? 'ok' : 'ko'}">${esc(t)}</span>` : setsHtml(s, o);
    const tot = t ? '' : `<span class="tot">${m['w' + k]}</span>`;
    return `<div class="pr ${win ? 'win' : ''}"><span class="n">${esc(pl.name)}${pl.rank ? `<small>${esc(pl.rank)}</small>` : ''}${mine ? '<span class="cb">Cailly</span>' : ''}</span>${sets}${tot || '<span></span>'}</div>`;
  }).join('');
  return `<div class="mc"><div class="mh"><span>${m.kind === 'double' ? 'Double ' + (m.no - 8) : 'Match ' + m.no}</span><span>${m.played ? (m.winner ? '' : 'Égalité') : 'Non joué'}</span></div>${rows}</div>`;
}
function renderTeamMatches(t, jn) {
  const p = t.phases[S.phase] ? S.phase : t.phaseList[t.phaseList.length - 1];
  const list = t.journees.filter(j => j.phase === p);
  let h = teamHead(t, 'matchs', p);
  if (!list.length) return h + `<div class="empty" style="margin-top:14px">Aucune feuille de match saisie pour la phase ${p}.</div>`;
  const cur = list.find(j => j.n === jn) || list.filter(j => j.played).pop() || list[list.length - 1];
  h += `<div class="chips">${list.map(j => `<a class="chip ${j === cur ? 'on' : ''}" href="#/equipe/${t.id}/matchs/${j.n}">Journée ${j.n}</a>`).join('')}<span style="color:var(--mute);align-self:center;font-size:12px">Les journées suivantes apparaissent dès qu’elles sont saisies dans l’Excel.</span></div>`;
  const rd = phaseData(t, p).rounds.find(r => r.n === cur.n);
  const dt = rd?.date ? fmtD(rd.date, true) : (rd?.dateLabel || '');
  const mine = cur.side === 1 ? 'V' : 'D';
  let res = 'N'; if (cur.sa !== cur.sb) res = (cur.side === 1) === (cur.sa > cur.sb) ? 'V' : 'D';
  const mism = cur.banner && cur.banner.a !== null && (cur.banner.a !== Math.max(cur.sa, cur.sb) || cur.banner.b !== Math.min(cur.sa, cur.sb));
  h += `<div class="banner"><div class="tm">${esc(cur.home)}<small>${cur.side === 1 ? 'Notre équipe · ' : ''}domicile</small></div>
    <div><div class="big"><span>${cur.sa}</span><span class="d">–</span><span>${cur.sb}</span></div><div class="res">${cur.side ? resTag(res) : ''}</div></div>
    <div class="tm r">${esc(cur.away)}<small>${cur.side === 2 ? 'Notre équipe · ' : ''}extérieur</small></div></div>
    <div class="legend"><span><b>Journée ${cur.n}</b>${dt ? ' · ' + esc(dt) : ''}</span><span>${esc(cur.div || t.division)} · Phase ${cur.phase}</span>${cur.banner ? `<span>Feuille de match : « ${esc(cur.banner.text)} »</span>` : ''}</div>`;
  if (mism) h += `<div class="warn"><b>À vérifier :</b> le score calculé à partir des sets (${cur.sa}-${cur.sb}) diffère du score indiqué sur la feuille (${esc(cur.banner.text)}).</div>`;
  h += `<div class="mgrid">${cur.matches.map(m => matchCard(m, cur.side)).join('')}</div>`;
  return h;
}

/* ---------- points gagnés / perdus ---------- */
function renderPoints() {
  const P = S.model.points;
  let h = `<div class="crumbs"><a href="#/">Accueil</a> › Points gagnés / perdus</div><div class="pagehead"><h2>Points gagnés / perdus</h2></div><p style="color:var(--mute);margin:4px 0 14px">${esc(P?.title || 'Évolution des points par journée')}. <b>Points live</b> = points de départ + cumul des gains et pertes.</p>`;
  if (!P) return h + '<div class="empty">Onglet « Points gagnés | Perdus » introuvable.</div>';
  const maxAbs = Math.max(1, ...P.rows.map(r => Math.abs(r.total)));
  const cell = v => { if (!isNum(v)) return '<td></td>'; const a = Math.min(1, Math.abs(v) / 20); return `<td style="background:${v > 0 ? `rgba(76,175,80,${.12 + a * .5})` : v < 0 ? `rgba(229,57,53,${.1 + a * .45})` : 'transparent'}">${v > 0 ? '+' : ''}${fmtN(v)}</td>`; };
  let last = null;
  h += `<div class="tw"><table class="d"><thead><tr><th class="y l" rowspan="2">Équipe</th><th class="y" rowspan="2">Points<br>départ</th><th class="y l" rowspan="2">Joueur</th><th class="y" colspan="${P.journees.length}">Journées</th><th class="y" rowspan="2">Live total +/-</th><th class="y" rowspan="2">Points live</th></tr><tr>${P.journees.map(n => `<th class="y">J${n}</th>`).join('')}</tr></thead><tbody>${
    P.rows.map(r => {
      const first = r.team !== last; last = r.team;
      const cnt = P.rows.filter(x => x.team === r.team).length;
      return `<tr>${first ? `<td class="nm" rowspan="${cnt}" style="background:var(--brand-l);vertical-align:middle">${r.teamNo ? `<a href="#/equipe/${r.teamNo}/stats">${esc(r.div)}<br>Équipe ${r.teamNo}</a>` : esc(r.team)}</td>` : ''}<td>${r.base ?? ''}</td><td class="nm">${esc(r.name)}</td>${r.vals.map(cell).join('')}
      <td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:10px;position:relative;background:#f3f2f1;border-radius:5px"><i style="position:absolute;top:0;bottom:0;${r.total >= 0 ? 'left:50%' : 'right:50%'};width:${Math.abs(r.total) / maxAbs * 50}%;background:${r.total >= 0 ? '#4caf50' : '#e53935'};border-radius:5px"></i></div>${sgn(r.total)}</div></td><td><b>${fmtN(r.live)}</b></td></tr>`;
    }).join('')}</tbody></table></div>`;
  return h;

function render() {
  if (!S.model) return;
  const route = location.hash.replace(/^#\/?/, '').split('/');
  let html;
  try {
    if (route[0] === 'equipe' && S.model.teams.find(t => t.id === +route[1])) {
      const t = S.model.teams.find(t => t.id === +route[1]);

  $('#src').textContent = S.src.embedded ? 'Données : ' + S.src.name : `Données : ${S.src.name} (importé le ${d})`;
  renderCmd();
}

const _rr = (x, n) => (x >>> n) | (x << (32 - n));
const _primes = (() => { const p = []; for (let n = 2; p.length < 64; n++) if (p.every(q => n % q)) p.push(n); return p; })();
const _K = _primes.map(p => Math.floor((Math.cbrt(p) % 1) * 4294967296) >>> 0);
const _H0 = _primes.slice(0, 8).map(p => Math.floor((Math.sqrt(p) % 1) * 4294967296) >>> 0);
function sha256(m) {
  const l = m.length, nb = ((l + 9 + 63) >> 6) << 6, b = new Uint8Array(nb); b.set(m); b[l] = 0x80;
  const dv = new DataView(b.buffer); dv.setUint32(nb - 4, (l * 8) >>> 0); dv.setUint32(nb - 8, Math.floor(l * 8 / 4294967296));
  const h = _H0.slice(), w = new Uint32Array(64);
  for (let o = 0; o < nb; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + 4 * i);
    for (let i = 16; i < 64; i++) { const a = w[i - 15], c = w[i - 2]; w[i] = (w[i - 16] + (_rr(a, 7) ^ _rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (_rr(c, 17) ^ _rr(c, 19) ^ (c >>> 10))) | 0; }
    let [a, b2, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (_rr(e, 6) ^ _rr(e, 11) ^ _rr(e, 25)) + ((e & f) ^ (~e & g)) + _K[i] + w[i]) | 0;
      const t2 = ((_rr(a, 2) ^ _rr(a, 13) ^ _rr(a, 22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + b2) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0; h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  const out = new Uint8Array(32), ov = new DataView(out.buffer); h.forEach((x, i) => ov.setUint32(i * 4, x >>> 0)); return out;
}
function hashPw(user, pw, salt) {
  const h = new TextEncoder().encode(salt + '|' + user.trim().toLowerCase() + '|' + pw);
  let d = sha256(h);
  for (let i = 0; i < 30000; i++) { const x = new Uint8Array(d.length + h.length); x.set(d); x.set(h, d.length); d = sha256(x); }
  return Array.from(d, v => v.toString(16).padStart(2, '0')).join('');
}
const rndHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), v => v.toString(16).padStart(2, '0')).join('');

  const o = document.createElement('div'); o.className = 'ovl'; o.id = 'modal';
  o.innerHTML = `<div class="mdl" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) closeModal(); });
  document.body.appendChild(o);
  const f = o.querySelector('input'); if (f) f.focus();
  return o;
}
const closeModal = () => { const m = $('#modal'); if (m) m.remove(); };

const actions = {
  login() {
    const o = modal(`<h3>Espace administrateur</h3><p>Réservé à la personne qui met à jour les statistiques.</p>
      <label for="lu">Identifiant</label><input id="lu" autocomplete="username"><label for="lp">Mot de passe</label><input id="lp" type="password" autocomplete="current-password">
      <div class="err" id="lerr"></div><div class="act"><button class="btn sec" id="lc">Annuler</button><button class="btn" id="lok">Se connecter</button></div>`);
    const go = async () => {
      const u = o.querySelector('#lu').value, p = o.querySelector('#lp').value, err = o.querySelector('#lerr');
      err.textContent = 'Vérification…'; await new Promise(r => setTimeout(r, 30));
      if (u.trim().toLowerCase() === AUTH.user.toLowerCase() && hashPw(u, p, AUTH.salt) === AUTH.hash) { S.admin = true; closeModal(); renderCmd(); toast('Connecté en tant qu’administrateur.'); }
      else { await new Promise(r => setTimeout(r, 900)); err.textContent = 'Identifiant ou mot de passe incorrect.'; }
    };
    o.querySelector('#lok').onclick = go; o.querySelector('#lc').onclick = closeModal;
    o.addEventListener('keydown', e => { if (e.key === 'Enter') go(); if (e.key === 'Escape') closeModal(); });
  },
  logout() { S.admin = false; renderCmd(); toast('Déconnecté.'); },
  imp() { if (S.admin) $('#file').click(); },
  async reset() { if (!S.admin) return; try { localStorage.removeItem(LS); } catch (e) {} await applyBuffer(b64ToBuf(EMBEDDED_XLSX), { name: EMBEDDED_NAME, date: null, embedded: true }); toast('Données d’origine rétablies.'); },
  cred() {
    if (!S.admin) return;
    const o = modal(`<h3>Modifier les identifiants</h3><p>Le nouveau mot de passe sera enregistré (sous forme d’empreinte) dans la page lors de « Publier la page mise à jour ».</p>
      <label for="cu">Identifiant</label><input id="cu" value="${esc(AUTH.user)}" autocomplete="username"><label for="cp">Nouveau mot de passe (8 caractères min.)</label><input id="cp" type="password" autocomplete="new-password">
      <label for="cp2">Confirmer le mot de passe</label><input id="cp2" type="password" autocomplete="new-password"><div class="err" id="cerr"></div>
      <div class="act"><button class="btn sec" id="cc">Annuler</button><button class="btn" id="cok">Enregistrer</button></div>`);
    o.querySelector('#cc').onclick = closeModal;
    o.querySelector('#cok').onclick = () => {
      const u = o.querySelector('#cu').value.trim(), p = o.querySelector('#cp').value, p2 = o.querySelector('#cp2').value, err = o.querySelector('#cerr');
      if (u.length < 3) return err.textContent = 'Identifiant trop court.';
      if (p.length < 8) return err.textContent = 'Mot de passe : 8 caractères minimum.';
      if (p !== p2) return err.textContent = 'Les deux mots de passe sont différents.';
      const salt = rndHex(8); AUTH = { user: u, salt, hash: hashPw(u, p, salt) };
      closeModal(); toast('Identifiants modifiés : cliquez sur « Publier la page mise à jour » pour les enregistrer.', 6000);
    };
  },
  pub() {
    if (!S.admin) return;
    const doc = document.documentElement.cloneNode(true);
    const sc = [...doc.querySelectorAll('script')].find(s => s.textContent.includes('const EMBEDDED_XLSX'));
    const name = S.src.name, b64 = bufToB64(S.buf);
    sc.textContent = sc.textContent
      .replace(/const EMBEDDED_NAME = "[^"]*";/, () => `const EMBEDDED_NAME = ${JSON.stringify(name)};`)
      .replace(/const EMBEDDED_DATE = \d+;/, () => `const EMBEDDED_DATE = ${Date.now()};`)
      .replace(/let AUTH = \{[^}]*\};/, () => `let AUTH = ${JSON.stringify(AUTH)};`)
      .replace(/const EMBEDDED_XLSX = "[^"]*";/, () => `const EMBEDDED_XLSX = "${b64}";`);
    doc.querySelector('#app').innerHTML = '<div class="empty">Chargement des données…</div>';
    for (const id of ['#nav', '#adm', '#src', '#modal']) { const e = doc.querySelector(id); if (e) e.innerHTML = ''; }
    const m = doc.querySelector('#modal'); if (m) m.remove();
    const t = doc.querySelector('#toast'); if (t) { t.removeAttribute('style'); t.textContent = ''; }
    const blob = new Blob(['<!DOCTYPE html>\n' + doc.outerHTML], { type: 'text/html' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'TT_du_Cailly_Statistiques_2026-2027.html';
    document.body.appendChild(a); a.click(); a.remove();
    try { localStorage.removeItem(LS); } catch (e) {}
    toast('Page téléchargée : remplacez le fichier mis en ligne par celui-ci pour que tout le monde voie les nouvelles données.', 8000);
  }
};

/* ---------- chargement / mise à jour ---------- */
const b64ToBuf = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };
const bufToB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const LS = 'ttc_stats_xlsx_v1';

async function applyBuffer(buf, src) {
  const model = await buildModel(buf);
  S.model = model; S.src = src; S.buf = buf; S.phase = bestPhase();
  render();
}
async function importFile(file) {
  try {
    const buf = await file.arrayBuffer();
    await applyBuffer(buf, { name: file.name, date: new Date(), embedded: false });
    try { localStorage.setItem(LS, JSON.stringify({ name: file.name, date: Date.now(), b64: bufToB64(buf) })); toast('Données mises à jour depuis « ' + file.name + ' » et mémorisées sur cet ordinateur.'); }
    catch (e) { toast('Données mises à jour (non mémorisées : stockage du navigateur indisponible).'); }
  } catch (e) { console.error(e); toast('Import impossible : ' + e.message, 6000); }
}

async function boot() {
  $('#file').onchange = e => { if (S.admin && e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
  $('#cmd').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) actions[b.dataset.act](); });
  $('#print').onclick = () => window.print();
  window.addEventListener('hashchange', render);
  try {
    if (typeof DecompressionStream === 'undefined') throw new Error('Navigateur trop ancien : utilisez une version récente de Edge, Chrome, Firefox ou Safari.');
    let saved = null; try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
    if (saved && saved.b64 && saved.date > EMBEDDED_DATE) {
      try { await applyBuffer(b64ToBuf(saved.b64), { name: saved.name, date: new Date(saved.date), embedded: false }); return; }
      catch (e) { console.warn('Données mémorisées illisibles, retour aux données intégrées', e); }
    }
    await applyBuffer(b64ToBuf(EMBEDDED_XLSX), { name: EMBEDDED_NAME, date: null, embedded: true });
  } catch (e) { console.error(e); $('#app').innerHTML = `<div class="warn"><b>Impossible de lire les données :</b> ${esc(e.message)}</div>`; }
}
boot();

</script>
